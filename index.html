<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nashville Sign and Lighting - Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }
    .logo img {
      max-width: 900px;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.1em;
      margin: 10px 0;
    }
    .contact-container {
      background-color: #111;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }
    .contact-container h1 {
      margin-bottom: 20px;
      font-size: 28px;
      color: #f0f0f0;
    }
    .contact-container a {
      color: #22fb00;
      text-decoration: none;
      font-size: 18px;
    }
    .contact-container a:hover {
      color: #ffff00;
      text-decoration: underline;
    }
    .contact-container p {
      font-size: 18px;
      margin: 20px 0;
    }
    .social {
      margin-top: 20px;
    }
    .social a {
      color: #39ff14;
      text-decoration: none;
      font-weight: bold;
    }
    .social a:hover {
      text-decoration: underline;
    }
    /* Mobile adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 0.9em;
      }
      p, .contact, .social {
        font-size: 0.9em;
      }
      .logo img {
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <img src="images\logo01.png" alt="Business Logo">
    </div>

    <!-- Business Name -->
    <h1>⚡ Master Electrician Services ⚡</h1>
    <br>
    <p>Our website is coming soon!</p>
    <br>

    <!-- Contact Information -->
  <div class="contact-container">
    <h1>Contact Us</h1>
    <p>Email: <a href="mailto:Sales@NSLTN.com">Sales@NSLTN.com</a></p>
    <p>Phone: <a href="tel:+6293092819">(629) 309-2819</a></p>
    </div>

    <!-- Facebook Link -->
    <div class="social">
      <p>Follow us on <a href="https://www.facebook.com/profile.php?id=61587091204113" target="_blank">Facebook</a></p>
    </div>
  </div>
</body>
</html>
