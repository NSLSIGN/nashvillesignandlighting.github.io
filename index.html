<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Master Electrician Services - Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }
    .logo {
      margin-bottom: 20px;
    }
    .logo img {
      filter: drop-shadow(0 0 1px #0f6300)
              drop-shadow(0 0 1px #0f6300)
              drop-shadow(0 0 1px #0f6300);
    }
    h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.1em;
      margin: 10px 0;
    }
    .contact {
      margin-top: 30px;
      font-size: 1em;
    }
    .social {
      margin-top: 20px;
    }
    .social a {
      color: #39ff14;
      text-decoration: none;
      font-weight: bold;
    }
    .social a:hover {
      text-decoration: underline;
    }
    /* Mobile adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.5em;
      }
      p, .contact, .social {
        font-size: 0.9em;
      }
      .logo img {
        max-width: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <img src="images\logo_01.png" alt="Business Logo">
    </div>

    <!-- Business Name -->
    <h2>⚡ Master Electrician Services ⚡</h2>
    <p>Our website is coming soon!</p>

    <!-- Contact Information -->
    <div class="contact">
      <p>Email: Sales@NSLTN.com</p>
      <p>Phone: (629) 309-2819</p>
    </div>

    <!-- Facebook Link -->
    <div class="social">
      <p>Follow us on <a href="https://www.facebook.com/OgemaDesignStudio" target="_blank">Facebook</a></p>
    </div>
  </div>
</body>
</html>
